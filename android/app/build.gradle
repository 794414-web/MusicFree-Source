apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import com.android.build.OutputFile
import groovy.json.JsonSlurper


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()

    //
    // 修复双重 Junction 路径下 Metro 入口解析错误：
    // 当 Metro 的 projectRoot 是 C:\Users\Administrator\Desktop\nnnn\MusicFree-Source 且
    // entryFile 也指向同一目录时，Metro _resolveRelativePath(relativeTo:"server") 会返回形如
    // `./../nnnn/MusicFree-Source/index.js` 的相对路径，metro resolver 再次解析即定位失败
    // （..\nnnn\nnnn\... 不存在）。
    // 这里使用 Metro 标准入口形式：`./index`（不带扩展名，以 projectRoot 为基准），
    // 即可让 Metro 直接定位到 `${projectRoot}/index.js`，彻底绕开双重路径问题。
    entryFile = file("${rootDir.getAbsoluteFile().getParentFile()}/index.js").getCanonicalFile()
    // 显式重写 Metro projectRoot，保证与 entryFile 同根，避免上述相对路径推断。
    project.ext.react = (project.hasProperty("react") ? project.property("react") : [:]) + [
        root: rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
    ]
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 *
 * 注意：必须保持 false。开启 R8 混淆会导致 React Native 桥接层在部分设备上
 * 启动闪退（历史 v1.0.8 曾因此修复手机闪退，v1.2.12 误重新开启后手机端再次闪退）。
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseProperty = { String name ->
    def value = project.findProperty(name) ?: System.getenv(name) ?: keystoreProperties.getProperty(name)
    return value == null ? null : value.toString().trim()
}
def releaseStoreFile = releaseProperty("RELEASE_STORE_FILE")
def releaseStorePassword = releaseProperty("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = releaseProperty("RELEASE_KEY_ALIAS")
def releaseKeyPassword = releaseProperty("RELEASE_KEY_PASSWORD")
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

static def getVersion() {
    def inputFile = new File("../package.json")
    def packageJson = new JsonSlurper().parseText(inputFile.text)
    return packageJson["version"]
}

static def parseVersionCode(String rawValue) {
    if (!rawValue?.isInteger()) {
        throw new GradleException("VERSION_CODE 必须是正整数")
    }
    def value = rawValue.toInteger()
    if (value <= 0) {
        throw new GradleException("VERSION_CODE 必须是正整数")
    }
    return value
}

static def deriveVersionCode(String version) {
    def matcher = version =~ /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/
    if (!matcher.matches()) {
        throw new GradleException("无法从版本号生成 VERSION_CODE：${version}")
    }
    def major = matcher.group(1).toInteger()
    def minor = matcher.group(2).toInteger()
    def patch = matcher.group(3).toInteger()
    def beta = matcher.group(4)
    if (major > 20 || minor > 99 || patch > 999) {
        throw new GradleException("版本号超出 VERSION_CODE 编码范围：${version}")
    }
    return major * 100000000 + minor * 1000000 + patch * 1000 + (beta ? Math.min(beta.toInteger(), 998) : 999)
}

def configuredVersionCode = project.findProperty("VERSION_CODE") ?: System.getenv("VERSION_CODE")
def appVersion = getVersion()
def appVersionCode = configuredVersionCode ? parseVersionCode(configuredVersionCode.toString()) : deriveVersionCode(appVersion)


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "fun.upup.musicfree"

    defaultConfig {
        applicationId "fun.upup.musicfree"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    splits {
            abi {
                reset()
                enable true
                universalApk true
                include ""
            }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && (
            task.name == "assembleRelease" ||
            task.name == "bundleRelease" ||
            task.name == "installRelease" ||
            task.name == "packageRelease" ||
            task.name == "packageReleaseUniversalApk"
        )
    }
    if (releaseRequested && !releaseSigningConfigured) {
        throw new GradleException("Release 构建缺少签名配置：RELEASE_STORE_FILE、RELEASE_STORE_PASSWORD、RELEASE_KEY_ALIAS、RELEASE_KEY_PASSWORD")
    }
    if (releaseRequested && releaseSigningConfigured && !file(releaseStoreFile).exists()) {
        throw new GradleException("Release 签名文件不存在：${releaseStoreFile}")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // !! Add lines
    implementation project(':react-native-fs')
    implementation 'com.facebook.fresco:animated-gif:2.5.0'
    // https://mvnrepository.com/artifact/net.jthink/jaudiotagger
    implementation 'net.jthink:jaudiotagger:2.2.5'
    implementation 'androidx.core:core-splashscreen:1.0.0'
    // OkHttp (通过 RN 传递引入，这里显式声明确保可用)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

