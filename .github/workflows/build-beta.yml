name: Android 发布构建

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建当前版本'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      version: ${{ steps.version_check.outputs.version }}
      release: ${{ steps.version_check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version_check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE=false
          SHOULD_BUILD=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${VERSION}" ]] || { echo "标签 ${GITHUB_REF_NAME} 与版本 ${VERSION} 不一致"; exit 1; }
            RELEASE=true
            SHOULD_BUILD=true
          elif [[ "${VERSION}" =~ -beta\.[0-9]+$ ]]; then
            SHOULD_BUILD=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            SHOULD_BUILD=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: chmod +x android/gradlew
      - name: 构建 Debug APK
        run: cd android && ./gradlew assembleDebug --parallel --build-cache
      - name: 整理 APK
        id: apk
        shell: bash
        run: |
          VERSION='${{ needs.check-version.outputs.version }}'
          mkdir -p release
          SOURCE=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          [[ -n "$SOURCE" ]] || { echo '未找到 Debug APK'; exit 1; }
          TARGET="release/MusicFree-${VERSION}-universal.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-${{ needs.check-version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
      - name: 发布 GitHub Release
        if: needs.check-version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ needs.check-version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MusicFree $TAG" --generate-notes
          gh release upload "$TAG" '${{ steps.apk.outputs.path }}' --clobber
